name: Backport CI policy

on:
  workflow_call:
    outputs:
      skip_tests:
        description: True only for an API-verified exact App backport
        value: ${{ jobs.verify.outputs.skip_tests }}

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip_tests: ${{ steps.policy.outputs.skip_tests }}
    steps:
      - name: Use trusted base policy, never PR code
        if: github.event_name == 'pull_request' && vars.BACKPORT_AUTOMATION_ENABLED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Check exact release evidence
        id: policy
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          ENABLED: ${{ vars.BACKPORT_AUTOMATION_ENABLED }}
          APP_ID: ${{ vars.BACKPORT_APP_ID }}
          APP_SLUG: ${{ vars.BACKPORT_APP_SLUG }}
        with:
          script: |
            core.setOutput('skip_tests', 'false');
            if (context.eventName !== 'pull_request' || process.env.ENABLED !== 'true') return;
            try {
              const { verifyPull } = require('./.github/scripts/verified-backport.cjs');
              const { owner, repo } = context.repo;
              const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: context.issue.number });
              await verifyPull({ github, owner, repo, pull,
                appId: Number(process.env.APP_ID), appSlug: process.env.APP_SLUG });
              core.setOutput('skip_tests', 'true');
              core.info('Exact App backport: reuse verified release evidence; application tests are not rerun.');
            } catch (error) {
              core.warning('Backport exception not verified; run normal CI.');
            }
