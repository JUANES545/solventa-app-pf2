name: CI · Validación

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: android-ci-${{ github.ref == 'refs/heads/master' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  verify:
    name: Android verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      skip_tests: ${{ steps.policy.outputs.skip_tests }}
    steps:
      - name: Obtener política confiable solo para candidatos a backport
        if: github.event_name == 'pull_request' && vars.BACKPORT_AUTOMATION_ENABLED == 'true' && startsWith(github.head_ref, 'backport/release-pr-')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Verificar evidencia del backport sin ejecutar código del PR
        id: policy
        if: github.event_name == 'pull_request' && vars.BACKPORT_AUTOMATION_ENABLED == 'true' && startsWith(github.head_ref, 'backport/release-pr-')
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          APP_ID: ${{ vars.BACKPORT_APP_ID }}
          APP_SLUG: ${{ vars.BACKPORT_APP_SLUG }}
        with:
          script: |
            core.setOutput('skip_tests', 'false');
            try {
              const { verifyPull } = require('./.github/scripts/verified-backport.cjs');
              const { owner, repo } = context.repo;
              const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: context.issue.number });
              await verifyPull({ github, owner, repo, pull,
                appId: Number(process.env.APP_ID), appSlug: process.env.APP_SLUG });
              core.setOutput('skip_tests', 'true');
              core.info('Backport exacto verificado: se reutiliza la evidencia de la entrega; no se repiten las pruebas.');
            } catch (error) {
              core.warning('No se verificó la excepción de backport; se ejecuta CI normal.');
            }

      - name: Check out repository
        if: steps.policy.outputs.skip_tests != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java 17
        if: steps.policy.outputs.skip_tests != 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.policy.outputs.skip_tests != 'true'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        if: steps.policy.outputs.skip_tests != 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Set up Node.js 22
        if: steps.policy.outputs.skip_tests != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Probar scripts de automatización
        id: automation
        if: steps.policy.outputs.skip_tests != 'true'
        run: |
          node --test .github/scripts/*.test.cjs
          python3 -m unittest discover -s scripts -p 'test_*summary.py'

      - name: Validar versión de la entrega
        id: version
        if: steps.policy.outputs.skip_tests != 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const { validateVersion } = require('./.github/scripts/release_android.cjs');
            const version = await validateVersion({ github, context });
            core.info(`Versión preparada: ${version.name} (código ${version.code})${version.level ? `; incremento ${version.level}` : ''}`);

      - name: Verify Android project
        id: android
        if: steps.policy.outputs.skip_tests != 'true'
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: Validar publicación de Solventa
        id: publication
        if: steps.policy.outputs.skip_tests != 'true'
        run: python3 -m unittest discover -s .github/scripts -p 'test_deploy_appetize.py'

      - name: Compilar Solventa
        id: package
        if: steps.policy.outputs.skip_tests != 'true'
        run: |
          ./gradlew --no-daemon assemblePreview
          mkdir -p distribution
          cp app/build/outputs/apk/preview/app-preview.apk distribution/Solventa.apk

      - name: Conservar APK validado
        id: apk
        if: steps.policy.outputs.skip_tests != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-apk
          path: distribution/Solventa.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload verification reports
        id: reports
        if: always() && steps.policy.outputs.skip_tests != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-verification-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar resumen de validación
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/ci_summary.py verification

  instrumentation:
    name: Android UI tests
    needs: verify
    if: needs.verify.outputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Run Espresso and Compose HTTP journeys on Android 35
        id: device
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon connectedDebugAndroidTest -PbackendE2e=false -Pandroid.testInstrumentationRunnerArguments.focusDiagnostics=true

      - name: Upload device test reports
        id: reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-device-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar resumen de interfaz
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/ci_summary.py instrumentation
