name: CI · Actions

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'En master: versión publicada para reintentar Appetize sin recompilar (ej. 0.2.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: android-ci-${{ github.ref == 'refs/heads/master' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  verify:
    if: inputs.release_version == ''
    name: Android verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      skip_tests: ${{ steps.policy.outputs.skip_tests }}
    steps:
      - name: Obtener política confiable solo para candidatos a backport
        if: github.event_name == 'pull_request' && vars.BACKPORT_AUTOMATION_ENABLED == 'true' && startsWith(github.head_ref, 'backport/release-pr-')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Verificar evidencia del backport sin ejecutar código del PR
        id: policy
        if: github.event_name == 'pull_request' && vars.BACKPORT_AUTOMATION_ENABLED == 'true' && startsWith(github.head_ref, 'backport/release-pr-')
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          APP_ID: ${{ vars.BACKPORT_APP_ID }}
          APP_SLUG: ${{ vars.BACKPORT_APP_SLUG }}
        with:
          script: |
            core.setOutput('skip_tests', 'false');
            try {
              const { verifyPull } = require('./.github/scripts/verified-backport.cjs');
              const { owner, repo } = context.repo;
              const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: context.issue.number });
              await verifyPull({ github, owner, repo, pull,
                appId: Number(process.env.APP_ID), appSlug: process.env.APP_SLUG });
              core.setOutput('skip_tests', 'true');
              core.info('Backport exacto verificado: se reutiliza la evidencia de la entrega; no se repiten las pruebas.');
            } catch (error) {
              core.warning('No se verificó la excepción de backport; se ejecuta CI normal.');
            }

      - name: Check out repository
        if: steps.policy.outputs.skip_tests != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java 17
        if: steps.policy.outputs.skip_tests != 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.policy.outputs.skip_tests != 'true'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        if: steps.policy.outputs.skip_tests != 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Set up Node.js 22
        if: steps.policy.outputs.skip_tests != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Probar scripts de automatización
        if: steps.policy.outputs.skip_tests != 'true'
        run: node --test .github/scripts/*.test.cjs

      - name: Validar versión de la entrega
        if: steps.policy.outputs.skip_tests != 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const { validateVersion } = require('./.github/scripts/release_android.cjs');
            const version = await validateVersion({ github, context });
            core.info(`Versión preparada: ${version.name} (código ${version.code})`);

      - name: Verify Android project
        if: steps.policy.outputs.skip_tests != 'true'
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: Test preview deployment request policy
        if: steps.policy.outputs.skip_tests != 'true'
        run: python3 -m unittest discover -s .github/scripts -p 'test_deploy_appetize.py'

      - name: Build preview APK
        if: steps.policy.outputs.skip_tests != 'true'
        run: ./gradlew --no-daemon assemblePreview

      - name: Retain validated preview APK
        if: steps.policy.outputs.skip_tests != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-preview-apk
          path: app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload verification reports
        if: always() && steps.policy.outputs.skip_tests != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-verification-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  publish_release:
    name: Publicar entrega Android
    needs: [verify, instrumentation]
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      inputs.release_version == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download this run's preview APK
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: android-preview-apk
          path: preview

      - name: Crear tag, APK y release sin sobrescribir entregas
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const { publishRelease } = require('./.github/scripts/release_android.cjs');
            const release = await publishRelease({ github, context, apk: 'preview/app-preview.apk' });
            core.setOutput('version', release.version);
            await core.summary.addHeading(`Entrega Android ${release.version}`)
              .addLink('Descargar APK y checksum', `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/releases/tag/${release.version}`)
              .addRaw(`\n\nCommit: \`${release.commit}\`\n\nSHA-256: \`${release.sha256}\`\n`).write();

  deploy_preview:
    name: Publicar preview Android
    needs: publish_release
    if: >-
      always() && github.ref == 'refs/heads/master' && vars.APPETIZE_ENABLED == 'true' &&
      (needs.publish_release.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_version != ''))
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: appetize-stable-preview
      cancel-in-progress: false
    uses: ./.github/workflows/appetize-deploy.yml
    with:
      version: ${{ inputs.release_version || needs.publish_release.outputs.version }}
      public_key: ${{ vars.APPETIZE_PUBLIC_KEY }}
    secrets:
      appetize_token: ${{ secrets.APPETIZE_API_TOKEN }}

  instrumentation:
    name: Android UI tests
    needs: verify
    if: needs.verify.outputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Run tests on Android 35
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload device test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-device-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
