name: Solventa App

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      public_key:
        required: true
        type: string
    secrets:
      appetize_token:
        required: true

permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  prepare:
    name: Seleccionar última entrega
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.select.outputs.publish }}
      url: ${{ steps.select.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Seleccionar versión vigente
        id: select
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PUBLIC_KEY: ${{ inputs.public_key }}
        with:
          script: |
            const { prepareDeployment } = require('./.github/scripts/release_android.cjs');
            const result = await prepareDeployment({ github, context, version: process.env.RELEASE_VERSION, publicKey: process.env.PUBLIC_KEY });
            core.setOutput('publish', result.publish);
            core.setOutput('url', result.url || '');
            if (!result.publish) await core.summary.addRaw('Publicación omitida: existe una versión más reciente.').write();

  deploy:
    name: Publicar Solventa
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      deployments: write
    environment:
      name: Solventa App
      url: ${{ needs.prepare.outputs.url }}
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Recuperar el APK original y comprobar su huella y procedencia
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          script: |
            const { downloadRelease } = require('./.github/scripts/release_android.cjs');
            await downloadRelease({ github, context, version: process.env.RELEASE_VERSION, directory: 'distribution' });
      - name: Actualizar la misma app sin iniciar streaming
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          APPETIZE_API_TOKEN: ${{ secrets.appetize_token }}
          APPETIZE_PUBLIC_KEY: ${{ inputs.public_key }}
        with:
          script: |
            const { deployApp } = require('./.github/scripts/release_android.cjs');
            await deployApp({ github, context, directory: 'distribution', publicKey: process.env.APPETIZE_PUBLIC_KEY });
